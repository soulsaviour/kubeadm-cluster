---
# Address other nodes use to reach this one. Matters on machines with more
# than one NIC (Vagrant, multi-homed hosts).
node_ip: "{{ ansible_host }}"

# Kubernetes minor version (selects the pkgs.k8s.io repository) and the exact
# package version to install. Upgrades are deliberate: bump both, then follow
# the kubeadm upgrade procedure.
kubernetes_minor: "1.37"
kubernetes_package_version: "1.37.2-1.1"

pod_network_cidr: 10.244.0.0/16
service_cidr: 10.96.0.0/12

# Stable address for the API server. For a single control-plane node this can
# stay empty (the node's own address is used). For HA, point it at a load
# balancer in front of every control-plane node, e.g. "k8s-api.example.com:6443".
control_plane_endpoint: ""
