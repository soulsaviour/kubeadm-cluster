---
- name: Check whether this node has already joined
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: join_kubelet_conf

- name: Create a short-lived join token on the first control-plane node
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 30m
  delegate_to: "{{ groups['control_plane'][0] }}"
  register: join_command
  changed_when: true
  when: not join_kubelet_conf.stat.exists

- name: Join the cluster as a worker
  ansible.builtin.command: "{{ join_command.stdout }}"
  when:
    - not join_kubelet_conf.stat.exists
    - inventory_hostname in groups['workers']
  changed_when: true
