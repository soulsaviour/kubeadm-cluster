name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ansible
        run: |
          pip install ansible-core ansible-lint
          ansible-galaxy collection install -r requirements.yml
      - name: Syntax check
        run: |
          for playbook in site.yml verify.yml reset.yml; do
            ansible-playbook -i inventory/hosts.example.yml "$playbook" --syntax-check
          done
      - name: ansible-lint
        run: ansible-lint
