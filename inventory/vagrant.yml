---
all:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.56.10
          ansible_ssh_private_key_file: .vagrant/machines/cp1/virtualbox/private_key
    workers:
      hosts:
        worker1:
          ansible_host: 192.168.56.21
          ansible_ssh_private_key_file: .vagrant/machines/worker1/virtualbox/private_key
        worker2:
          ansible_host: 192.168.56.22
          ansible_ssh_private_key_file: .vagrant/machines/worker2/virtualbox/private_key
  vars:
    ansible_user: vagrant
    ansible_ssh_common_args: -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
